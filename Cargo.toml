[package]
name = "mimo"
version = "0.2.0"
edition = "2024"
authors = ["aisaniya <aimy1@github>"]
description = "Minimal Mihomo Manager TUI for Linux"

[dependencies]
# 1. Async Runtime & Networking
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# 2. TUI & Event Loop
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# 3. Serialization & YAML Parser
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
base64 = "0.22"

# 4. CLI, Path & Config
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
urlencoding = "2.1"
libc = "0.2"
which = "7.0"

# 5. Logging, Hardware & Error Handling
anyhow = "1.0"
flate2 = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.31"
