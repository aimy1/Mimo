name: Release & Multi-Distro Build Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Binaries for Target Architectures
  # ---------------------------------------------------------------------------
  build-matrix:
    name: Build Binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact Directory
        run: |
          mkdir -p dist/mimo-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/mimo dist/mimo-${{ matrix.arch }}/
          cp README.md LICENSE dist/mimo-${{ matrix.arch }}/ 2>/dev/null || true
          tar -czvf dist/mimo-${{ matrix.arch }}.tar.gz -C dist mimo-${{ matrix.arch }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/mimo-${{ matrix.arch }}.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Package DEB, RPM & Assets via NFPM
  # ---------------------------------------------------------------------------
  package:
    name: Build Multi-Distro Packages
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          path: bin-artifacts

      - name: Install NFPM Tool
        run: |
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz | tar -xz nfpm
          sudo mv nfpm /usr/local/bin/

      - name: Build DEB & RPM Packages
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.3.1"
          fi
          mkdir -p build release-packages

          tar -xvf bin-artifacts/binary-x86_64/mimo-x86_64.tar.gz -C build/
          VERSION=$VERSION ARCH=amd64 BIN_PATH=build/mimo-x86_64/mimo nfpm package --config packaging/nfpm.yaml --target release-packages/mimo_${VERSION}_amd64.deb
          VERSION=$VERSION ARCH=x86_64 BIN_PATH=build/mimo-x86_64/mimo nfpm package --config packaging/nfpm.yaml --target release-packages/mimo-${VERSION}-1.x86_64.rpm
          cp bin-artifacts/binary-x86_64/mimo-x86_64.tar.gz release-packages/mimo-${VERSION}-x86_64.tar.gz

      - name: Generate SHA256 Checksums
        run: |
          cd release-packages
          sha256sum * > SHA256SUMS.txt

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-packages/*

  # ---------------------------------------------------------------------------
  # 3. Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release Packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist-release

      - name: Generate Changelog & Release Notes
        id: release_notes
        run: |
          echo "## ⚡ Mimo ${{ github.ref_name }} Release Notes" > NOTES.md
          echo "" >> NOTES.md
          echo "### 🚀 Highlights & Features" >> NOTES.md
          echo "- **Zero Dependency Mihomo Auto-Installer**: Instant deployment for Linux systems." >> NOTES.md
          echo "- **TUN Adapter Support**: Meta virtual network adapter integration with capability authorization." >> NOTES.md
          echo "- **Full Multi-Distro Support**: .deb, .rpm, .tar.gz, and install.sh script." >> NOTES.md
          echo "" >> NOTES.md
          echo "### 📦 Installation" >> NOTES.md
          echo "```bash" >> NOTES.md
          echo "curl -fsSL https://raw.githubusercontent.com/aimy1/Mimo/main/scripts/install.sh | bash" >> NOTES.md
          echo "```" >> NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md
          files: dist-release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
